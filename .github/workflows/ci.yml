name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @b4/react run test
      - run: pnpm --filter @b4/motion run test
      - run: pnpm --filter @b4/studio run build
      - run: pnpm --filter @b4/studio run build-storybook
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm consumer-smoke
      - run: pnpm ssr-smoke
      - run: pnpm treeshake-check
      - run: pnpm exec playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
